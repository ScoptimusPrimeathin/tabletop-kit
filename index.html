<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app draw under the iPhone notch;
       the CSS uses safe-area insets to keep buttons clear of it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tabletop Kit</title>
  <meta name="theme-color" content="#1b1a24">
  <!-- These make "Add to Home Screen" behave like a real app on iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tabletop Kit">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <h1 id="title">Tabletop Kit</h1>
      <button id="campaign-btn" aria-label="Switch campaign">…</button>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙︎</button>
    </header>
    <nav id="nav"></nav>
    <main id="main"><p class="muted center">Loading…</p></main>
    <aside id="side-log"></aside>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
